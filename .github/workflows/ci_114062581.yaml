name: CI pipeline

on:
    push:
        branches:
            - "**"

jobs:
    check-and-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 22

            - name: Install dependencies
              run: npm ci

            - name: TypeScript typecheck
              run: npm run typecheck

            - name: Prettier check
              run: npm run format:check

            - name: Test
              run: npm run test -- --reporter=junit --outputFile=vitest-junit.xml

            - name: Report Test Results
              uses: dorny/test-reporter@v1
              if: always()
              with:
                name: Vitest Test Report
                path: vitest-junit.xml
                reporter: java-junit